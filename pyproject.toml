[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-bot-cli"
version = "0.1.0"
description = "Command-line interface & Python SDK for the WeChat claw bot API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "jakezhu9"},
]
keywords = ["wechat", "bot", "cli", "ilink", "sdk", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "cryptography>=41.0",
    "qrcode>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "coverage[toml]>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/jakezhu9/wechat-bot-cli"
Repository = "https://github.com/jakezhu9/wechat-bot-cli"
Issues = "https://github.com/jakezhu9/wechat-bot-cli/issues"
Changelog = "https://github.com/jakezhu9/wechat-bot-cli/blob/main/CHANGELOG.md"

[project.scripts]
wechat-bot-cli = "wechat_bot_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["wechat_bot_cli"]

[tool.coverage.report]
show_missing = true
skip_empty = true
